services:
  oldif-back:
    build: .
    image: oldif-back:${IMAGE_TAG:-dev}
    environment:
      BACK_BIND: ${BACK_BIND}
      OLDIF_DB_URL: ${OLDIF_DB_URL}
      OLDIF_COVENANT_URL: ${OLDIF_COVENANT_URL}
      OLDIF_CORE_URL: ${OLDIF_CORE_URL}
      OLDIF_CORE_GRPC_URL: ${OLDIF_CORE_GRPC_URL}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      APP_ORIGIN: ${APP_ORIGIN}
      SESSION_SECONDS: ${SESSION_SECONDS}
      MAX_ACTIVE_RUNS: ${MAX_ACTIVE_RUNS}
      DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES}
      DOCUMENT_MAX_PAGES: ${DOCUMENT_MAX_PAGES}
      DOCUMENT_MAX_TEXT_BYTES: ${DOCUMENT_MAX_TEXT_BYTES}
      DOCUMENT_TIMEOUT_SECONDS: ${DOCUMENT_TIMEOUT_SECONDS}
      DOCUMENT_MEMORY_MB: ${DOCUMENT_MEMORY_MB}
      POPPLER_BIN_DIR: ${POPPLER_BIN_DIR}
    ports: ["${HOST_PORT:-8080}:8080"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
